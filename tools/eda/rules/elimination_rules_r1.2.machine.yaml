tests_required:
  - "microbiological urine -> active material trace; no r_U, fe, CLR or T10"
  - "missing interval not zero; COLLECTION_GAP label 'sum over collected intervals'"
  - "printed total + increments never added; conflict keeps both"
  - "partial plasma -> WINDOW_PROXY with both windows; disjoint data without independent directional support -> report separately"
  - "incomplete urine plus a point estimate of AUC alone gives no clearance lower bound"
  - "matched cohort marginal means alone do not identify the group filtration prediction"
  - "mean individual clearance cannot be inverted to check mean AUC"
  - "separately averaged component and recovery percentages cannot be multiplied without aggregation support"
  - "one unlabelled bile-parent measurement enters Table 2 or its qualitative note without a whole-body mass balance"
  - "T10 unmatched GFR -> CANNOT_ASSESS, FILTRATION_REFERENCE_UNMATCHED, even when the ranges overlap"
  - "extravascular data only with a reliable window AUC: Q1 ANSWERABLE"
  - "renal sign comparison status DESCRIBED; no direction inferred"
  - "item 31 cites absorption:T5 and distribution:T9 by test id, each with its own question"
  - "every code token in this file is emitted by the code or listed in labels.not_implemented"
  - "rules_manifest output_version, this file meta.version and the section json version agree"
  - "T12 > 100 % kept as printed; later-day % of day dose not capped"
  - "Q2/Q3 status copied from upstream, no re-plot"
  - "single-dose design: Q3 NOT_APPLICABLE; reported-only answer <= PARTLY_ANSWERABLE"
