tests_required:
  - "nine guide rows per board, in guide order, each with legacy_q"
  - "half-life grades at 0.80, 1.25 and 2.0, lower bound inclusive; UNRESOLVED only when qualified window pairs give different readings; NOT_ASSESSABLE names the missing side"
  - "selected terminal window = longest qualified window within adj_r2_tie of the best adjusted R2"
  - "WINDOW_BASED_ESTIMATE only with same study, justified early coverage and both tail fractions <= tail_fraction_max"
  - "T2 never runs on group means or destructive sampling; T4 never sets the flip-flop reading"
  - "SENSITIVITY_ONLY, BORDERLINE, SINGLE_POINT_SUPPORT and LOO_NOT_ASSESSABLE never give EXCLUDED; a formal CANNOT_ASSESS keeps removal flags in <test>_sensitivity_flags"
  - "removal reruns the whole search for every eligible observation"
  - "ranking keeps every option; a sensitivity-level contradiction keeps a candidate in its group (shared S5)"
  - "a screen without SD and n cannot raise an absorption-rate candidate to SUPPORTED"
  - "rules_manifest output_version, this file meta.version and the section json version agree"
  - "input_patterns has 16 entries whose t1/t2 coverage matches this file"
  - "this file and the code carry no example studies or simulated values; those stay in Appendix A"
