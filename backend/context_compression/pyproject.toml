[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-context-compression"
version = "3.11.0"
description = "Source-bound research context extraction and literature-informed workflow planning"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
documents = ["pypdf>=5", "python-docx>=1.2", "openpyxl>=3.1"]
test = ["pytest>=8,<10"]

[project.scripts]
context-compression = "ctxcomp.cli:main"

[tool.setuptools.package-data]
ctxcomp = ["resources/*.json", "resources/*.md"]

[tool.setuptools.packages.find]
include = ["ctxcomp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
