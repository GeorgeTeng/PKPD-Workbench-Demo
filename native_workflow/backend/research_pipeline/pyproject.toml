[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkpd-research-pipeline"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20", "openpyxl>=3.1,<4", "pypdf>=5", "scipy>=1.13,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
workflow = ["langgraph==1.2.11", "langgraph-checkpoint-sqlite==3.1.1", "prefect==3.8.6", "snakemake==9.27.0", "psutil>=7,<8"]

[project.scripts]
research-pipeline = "research_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["research_pipeline*"]

[tool.setuptools.package-data]
research_pipeline = ["schemas/*.json", "resources/pk_references/*.json", "resources/context_builder/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
